    <link rel="canonical" href="https://jacobdaum.github.io/posts/reader/">
    <link rel="stylesheet" href="/posts/assets/style.css?v=20260811-5">
    
    <link rel="stylesheet" href="/posts/assets/pdf-reader.css?v=1">
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body class="pdf-reader-page">
    <header class="site-header">
      <a class="site-title" href="/posts/">Jacob's Thoughts</a>
      <a class="site-nav" href="/posts/writing/">Writing</a>
    </header>
    <main class="page-shell">
      
        <article class="post">
          <div class="post-tools">
            <a class="back-link" href="/posts/writing/">← All writing</a>
            
          </div>
          <h1 id="pdf-reader-title">Document</h1>
          
            <section class="pdf-reader" aria-label="PDF document reader">
  <div class="pdf-reader-toolbar">
    <p id="pdf-reader-progress" role="status">Loading document…</p>
    <a id="pdf-reader-download" href="#" target="_blank" rel="noopener">Open original PDF ↗</a>
  </div>
  <div id="pdf-reader-error" class="pdf-reader-error" hidden></div>
  <div id="pdf-document" class="post-body pdf-document"></div>
</section>

          
        </article>
      
    </main>
    <footer class="site-footer">
      
        <span>Jacob Daum</span>
      
    </footer>
    
      <script>
        (() => {
          const params = new URLSearchParams(window.location.search);
          const requestedPdf = params.get("pdf") || "";
          const requestedTitle = params.get("title") || "Document";
          let pdfUrl = null;
          try {
            const candidate = new URL(requestedPdf, window.location.origin);
            if (candidate.origin === window.location.origin && candidate.pathname.startsWith("/posts/assets/")) {
              pdfUrl = candidate;
            }
          } catch (_error) {}
          window.JACOB_PDF_READER = {
            pdfUrl: pdfUrl ? pdfUrl.toString() : "",
            title: requestedTitle,
            pdfModule: "/posts/assets/vendor/pdf.min.mjs",
            pdfWorker: "/posts/assets/vendor/pdf.worker.min.mjs"
          };
          document.querySelector("#pdf-reader-title").textContent = requestedTitle;
          document.title = `${requestedTitle} · Jacob's Thoughts`;
        })();
      </script>
      <script defer src="/posts/assets/pdf-reader.js?v=2"></script>
    
    
  </body>
</html>
