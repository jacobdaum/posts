      <script>
        (() => {
          const params = new URLSearchParams(window.location.search);
          const requestedPdf = params.get("pdf") || "";
          const requestedTitle = params.get("title") || "Document";
          let pdfUrl = null;
          try {
            const candidate = new URL(requestedPdf, window.location.origin);
            if (candidate.origin === window.location.origin && candidate.pathname.startsWith("/posts/assets/")) {
              pdfUrl = candidate;
            }
          } catch (_error) {}
          window.JACOB_PDF_READER = {
            pdfUrl: pdfUrl ? pdfUrl.toString() : "",
            title: requestedTitle,
            pdfModule: "/posts/assets/vendor/pdf.min.mjs",
            pdfWorker: "/posts/assets/vendor/pdf.worker.min.mjs"
          };
          document.querySelector("#pdf-reader-title").textContent = requestedTitle;
          document.title = `${requestedTitle} · Jacob's Thoughts`;
        })();
      </script>
      <script defer src="/posts/assets/pdf-reader.js?v=2"></script>
    
    
      <aside class="annotation-panel" id="annotation-panel" aria-label="Public annotations" aria-hidden="true">
        <div class="annotation-panel__header">
          <div>
            <p class="annotation-kicker">Reader layer</p>
            <h2>Annotations</h2>
          </div>
          <button class="annotation-close" id="annotation-close" type="button" aria-label="Close annotations">×</button>
        </div>
        <p class="annotation-intro">Notes from approved readers appear as highlights in the essay. Select a passage to leave one.</p>
        <div id="annotation-session"></div>
        <div id="annotation-composer" hidden>
          <blockquote id="annotation-quote"></blockquote>
          <label for="annotation-comment">Your note</label>
          <textarea id="annotation-comment" rows="4" maxlength="2000"></textarea>
          <div class="annotation-actions">
            <button id="annotation-submit" class="annotation-primary" type="button">Publish note</button>
            <button id="annotation-cancel" class="annotation-secondary" type="button">Cancel</button>
          </div>
        </div>
        <p class="annotation-status" id="annotation-status" role="status"></p>
        <div id="annotation-list" class="annotation-list"></div>
        <section id="annotation-moderation" class="annotation-moderation" hidden>
          <h3>Invite a reader</h3>
          <div id="annotation-account-queue"></div>
        </section>
      </aside>
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
      <script>
        window.JACOB_ANNOTATIONS = {
          url: "https://qzywmkjrmpnumusjjyac.supabase.co",
          publishableKey: "sb_publishable_t8JI4dNYVEe3YA971I6Tjw_R0kULQyk",
          pagePath: "/reader/",
          pageTitle: "Document",
          waitForContentReady: true
        };
        
          window.JACOB_ANNOTATIONS.pagePath = window.JACOB_PDF_READER.pdfUrl
            ? `pdf:${new URL(window.JACOB_PDF_READER.pdfUrl).pathname}`
            : "pdf:invalid";
          window.JACOB_ANNOTATIONS.pageTitle = window.JACOB_PDF_READER.title;
        
      </script>
      <script defer src="/posts/assets/annotations.js?v=2"></script>
